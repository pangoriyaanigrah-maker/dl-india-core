# .github/workflows/update-signals.yml
# Nightly NSE signal refresh for DL India Core dashboard.
# Runs after Indian market close (15:30 IST = 10:00 UTC), Mon-Fri.
name: update-signals

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST daily Mon-Fri (buffer after close)
  workflow_dispatch: {}        # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install yfinance

      - name: Build signals.json
        run: python build_signals.py

      - name: Commit if changed
        run: |
          git config user.name "signals-bot"
          git config user.email "actions@github.com"
          git add signals.json
          if git diff --cached --quiet; then
            echo "signals.json unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: nightly signals refresh"
          # master can move during the ~2min fetch above (a save from the app,
          # or another manual run) -- rebase onto whatever's current before
          # pushing, or a plain push fails outright instead of just retrying.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
